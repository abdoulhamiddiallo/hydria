<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hydria · L’eau en Europe</title>
<meta name="description" content="Consommation, prix, factures, fuites, stress hydrique et épuration de l’eau dans les 27 pays de l’Union européenne, comparés au Royaume-Uni.">
<meta name="theme-color" content="#0b4f79">
<meta property="og:title" content="Hydria · L’eau en Europe">
<meta property="og:description" content="L’eau du robinet dans l’Union européenne et au Royaume-Uni, chiffre par chiffre : consommation, prix, factures, fuites, stress hydrique.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('hydria-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>:root{
  color-scheme:light;
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f0f3f7; --surface-3:#e6ebf1;
  --ink:#0b1b2b; --ink-2:#3f5062; --muted:#6a7888; --line:#dfe5ec; --line-2:#c9d2dc;
  --brand:#0b4f79; --brand-ink:#ffffff; --deep:#071c2e;
  --eu:#2a78d6; --uk:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95; --q7:#0d366b;
  --nodata:#e9edf2; --ctx:#e3e8ee; --sea:#eaf2fb; --grid:#e8edf3;
  --shadow:0 1px 2px rgba(11,27,43,.05),0 4px 16px rgba(11,27,43,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b121b; --surface:#131c28; --surface-2:#182331; --surface-3:#1f2b3a;
    --ink:#eef3f8; --ink-2:#b8c4d1; --muted:#8a99aa; --line:#243142; --line-2:#33445a;
    --brand:#5aa9e6; --brand-ink:#06121e; --deep:#060d15;
    --eu:#3987e5; --uk:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --q1:#16273a; --q2:#173b62; --q3:#1c5cab; --q4:#2a78d6; --q5:#5598e7; --q6:#86b6ef; --q7:#cde2fb;
    --nodata:#1b2533; --ctx:#18212d; --sea:#0f1925; --grid:#1f2a38;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b121b; --surface:#131c28; --surface-2:#182331; --surface-3:#1f2b3a;
  --ink:#eef3f8; --ink-2:#b8c4d1; --muted:#8a99aa; --line:#243142; --line-2:#33445a;
  --brand:#5aa9e6; --brand-ink:#06121e; --deep:#060d15;
  --eu:#3987e5; --uk:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --q1:#16273a; --q2:#173b62; --q3:#1c5cab; --q4:#2a78d6; --q5:#5598e7; --q6:#86b6ef; --q7:#cde2fb;
  --nodata:#1b2533; --ctx:#18212d; --sea:#0f1925; --grid:#1f2a38;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em;line-height:1.2}
.serif{font-family:Fraunces,Georgia,serif;font-optical-sizing:auto}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- En-tête ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{flex:none}
.brand b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--muted);line-height:1.1;white-space:nowrap}
.spacer{flex:1}
.iconbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);font-size:13.5px}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.iconbtn kbd{font:11px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:5px;padding:3px 5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{border-top:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;height:46px;align-items:stretch}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{display:flex;align-items:center;padding:0 9px;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- Mise en page ---------- */
main{min-height:70vh;padding:28px 0 60px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:6px 0 22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.page-h h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(28px,4vw,40px);margin-top:6px}
.page-h p{max-width:720px;color:var(--ink-2);margin:10px 0 0}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16.5px;font-weight:650}
.card .sub{color:var(--muted);font-size:13px;margin:4px 0 14px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.src{font-size:11.5px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:9px}
.note{font-size:12.5px;color:var(--muted)}
.section-t{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;margin:38px 0 14px}
.lead{font-size:16px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.flag{width:22px;height:16.5px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none;vertical-align:middle}
.flag.lg{width:44px;height:33px;border-radius:5px}

/* ---------- Contrôles ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
select.sel{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 34px 0 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:100%;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .flag{width:18px;height:13.5px}
.btn{height:38px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:0 14px;cursor:pointer;font-weight:550;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.08)}
input[type=range]{accent-color:var(--brand);width:100%}
label.field{display:block;font-size:13px;color:var(--ink-2)}
label.field b{float:right;color:var(--ink);font-weight:650}

/* ---------- Héros ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,#0b3d63 0%,#072a45 55%,#051c30 100%);color:#fff;padding:52px 44px 44px;isolation:isolate;box-shadow:var(--shadow)}
:root[data-theme="dark"] .hero{background:linear-gradient(160deg,#0c3556 0%,#082338 55%,#06182a 100%)}
.hero h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(32px,5.2vw,58px);line-height:1.04;max-width:780px;letter-spacing:-.02em}
.hero p{max-width:640px;color:#cfe1f2;font-size:17px;margin:16px 0 0}
.hero .eyebrow{color:#9cc6ea}
.hero svg.waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:120px;z-index:-1;opacity:.9}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero .cta a{height:42px;border-radius:11px;padding:0 16px;display:inline-flex;align-items:center;font-weight:600;text-decoration:none;font-size:14.5px}
.hero .cta a.p{background:#fff;color:#072a45}
.hero .cta a.s{border:1px solid rgba(255,255,255,.35);color:#fff}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:40px;background:rgba(255,255,255,.14);border-radius:14px;overflow:hidden}
.hero-stats div{background:rgba(5,28,48,.55);padding:16px 18px}
.hero-stats b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.hero-stats span{font-size:12.5px;color:#b7d0e6}
@media (max-width:760px){.hero{padding:34px 22px 28px}.hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Duel UE / RU ---------- */
.duel{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.duel-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr);gap:18px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.duel-row:first-child{border-top:0}
.duel-row .lab b{display:block;font-size:14.5px}
.duel-row .lab span{font-size:12.5px;color:var(--muted)}
.duel-bars{display:grid;gap:5px}
.db{display:grid;grid-template-columns:34px minmax(0,1fr) 88px;align-items:center;gap:8px;font-size:13px}
.db i{height:12px;border-radius:0 4px 4px 0;display:block;min-width:2px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.db em{font-style:normal;font-weight:650;text-align:right;white-space:nowrap}
.db .who{font-size:11.5px;font-weight:700;color:var(--muted)}
.verdict{font-size:12px;color:var(--ink-2);margin-top:3px}
@media (max-width:620px){.duel-row{grid-template-columns:minmax(0,1fr);gap:8px}}

/* ---------- Tuiles ---------- */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .v{font-size:28px;font-weight:720;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:550;color:var(--ink-2);margin-left:3px}
.kpi .c{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.up{color:var(--crit)} .down{color:var(--good)}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:20px;border-radius:6px;background:var(--surface-3);font-size:11.5px;font-weight:700;padding:0 6px;color:var(--ink-2)}

/* ---------- Graphiques ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:12px}
.chart text:not([fill]){fill:var(--ink-2)}
.chart .axis text{font-size:11.5px}
.chart .axis text:not([fill]){fill:var(--muted)}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart text.lbl{fill:var(--ink);font-weight:600;font-size:12px}
.chart .hit{fill:transparent;cursor:pointer}
.chart .row:hover .bar,.chart .row:focus .bar{filter:brightness(1.12)}
.chart .row:focus{outline:none}
.chart .row:focus .hit{stroke:var(--ink);stroke-width:1}
.chart .xh{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;width:16px;border-radius:2px}
.ramp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ramp .sw{display:flex;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.ramp .sw i{width:30px;height:10px;display:block}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:0 8px 28px rgba(0,0,0,.18);border-radius:10px;padding:9px 11px;font-size:12.5px;min-width:150px;max-width:280px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip .tt{font-weight:650;margin-bottom:5px;display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12px}
.tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:2px}
.tip .tr b{font-size:14px;color:var(--ink)}
.tip .tr span{color:var(--muted)}
.tip .k{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ---------- Carte ---------- */
.mapbox{position:relative}
.mapbox svg path.c{stroke:var(--surface);stroke-width:.8;cursor:pointer;transition:fill .35s}
.mapbox svg path.c:hover,.mapbox svg path.c.hl{stroke:var(--ink);stroke-width:1.6}
.mapbox svg path.x{fill:var(--ctx);stroke:var(--surface);stroke-width:.6}
.mapbox svg rect.sea{fill:var(--sea)}
.map-side{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.map-side{grid-template-columns:minmax(0,1fr)}}
.mini-rank{display:grid;gap:3px;max-height:560px;overflow:auto;padding-right:4px}
.mini-rank a{display:grid;grid-template-columns:24px 22px minmax(0,1fr) auto;gap:8px;align-items:center;text-decoration:none;padding:5px 6px;border-radius:8px;font-size:13.5px}
.mini-rank a:hover,.mini-rank a.hl{background:var(--surface-2)}
.mini-rank a .n{color:var(--muted);font-size:12px;text-align:right}
.mini-rank a.uk{box-shadow:inset 3px 0 0 var(--uk)}
.mini-rank a.eu{box-shadow:inset 3px 0 0 var(--eu);font-weight:650}

/* ---------- Tableaux ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
table.t th,table.t td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{position:sticky;top:0;background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:650;cursor:pointer;user-select:none;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.t th:first-child{background:var(--surface-2);z-index:2}
table.t tr.uk td{background:color-mix(in srgb,var(--uk) 8%,var(--surface))}
table.t tr.eu td{background:color-mix(in srgb,var(--eu) 8%,var(--surface));font-weight:650}
table.t td .cellbar{display:inline-block;height:6px;border-radius:3px;background:var(--q4);vertical-align:middle;margin-left:8px;opacity:.55}
.best{color:var(--good);font-weight:700}
.worse{color:var(--crit);font-weight:700}

/* ---------- Profil ---------- */
.prof-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prof-h h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,4vw,40px);font-weight:600}
.vs{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-3)}
.bar100{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.bar100 i{display:block;height:100%}

/* ---------- Calculateur ---------- */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px}
@media (max-width:900px){.calc{grid-template-columns:minmax(0,1fr)}}
.calc .fields{display:grid;gap:16px}
.big{font-size:52px;font-weight:760;letter-spacing:-.03em;line-height:1}
.big small{font-size:18px;font-weight:600;color:var(--ink-2)}
.gauge{position:relative;height:14px;border-radius:7px;background:var(--surface-3);margin:22px 0 34px}
.gauge i{position:absolute;top:-6px;width:2px;height:26px;background:var(--ink-2)}
.gauge i span{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:11.5px;white-space:nowrap;color:var(--muted)}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--brand);transition:width .4s}

/* ---------- Frise ---------- */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev:before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--eu))}
.tl .ev b{font-size:13px;color:var(--muted);display:block}
.tl .ev h4{font-size:15px;margin:2px 0 3px}
.tl .ev p{margin:0;font-size:13.5px;color:var(--ink-2)}

/* ---------- Palette de recherche ---------- */
.kmask{position:fixed;inset:0;background:rgba(3,10,18,.45);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0}
.kmask.on{display:flex}
.kbox{width:min(620px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.kbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:none}
.kres{max-height:52vh;overflow:auto;padding:6px}
.kres a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:14.5px}
.kres a.on,.kres a:hover{background:var(--surface-2)}
.kres a small{margin-left:auto;color:var(--muted);font-size:12px}

footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.facts{display:grid;gap:12px}
.fact{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.fact .n{font-size:26px;font-weight:750;letter-spacing:-.02em;min-width:92px}
.fact p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}
.nation{border-left:4px solid var(--c);padding-left:14px}
.nation h4{font-size:16px}
.nation dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:10px 0 0}
.nation dt{color:var(--muted)} .nation dd{margin:0;font-weight:550}
.hide-sm{} @media (max-width:640px){.hide-sm{display:none}}
@media (max-width:560px){.brand small{display:none}.top .wrap{gap:8px}.seg button{padding:5px 8px}.wrap{padding:0 14px}.card{padding:16px}}
/* ---------- v2 ---------- */
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:center}
.hero-mapbox{position:relative}
.hero-map{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25))}
.hero-leg{position:absolute;right:6px;bottom:6px;display:flex;gap:12px;font-size:12px;color:#cfe1f2}
.hero-leg span{display:inline-flex;align-items:center;gap:6px}.hero-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-mapbox{max-width:420px;margin:0 auto;opacity:.9}}
.cycle{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cycle:before{content:"";position:absolute;left:8%;right:8%;top:51px;height:3px;background:linear-gradient(90deg,var(--q3),var(--eu),var(--crit) 45%,var(--eu) 55%,var(--s3));opacity:.55}
.step{position:relative;padding:22px 16px 20px;text-decoration:none;border-left:1px solid var(--line);transition:background .2s}
.step:first-child{border-left:0}
.step:hover{background:var(--surface-2)}
.step .ico{position:relative;width:58px;height:58px;border-radius:50%;background:var(--surface);border:2px solid var(--eu);display:flex;align-items:center;justify-content:center;color:var(--eu);margin-bottom:14px;z-index:1}
.step:nth-child(3) .ico{border-color:var(--crit);color:var(--crit)}
.step:nth-child(6) .ico{border-color:var(--s3);color:var(--s3)}
.step .ico span{position:absolute;top:-6px;right:-8px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;border-radius:999px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.step .st{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step .sn{font-size:26px;font-weight:760;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.1}
.step p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
@media (max-width:1100px){.cycle{grid-template-columns:repeat(3,minmax(0,1fr))}.cycle:before{display:none}.step:nth-child(4){border-left:0}.step:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:640px){.cycle{grid-template-columns:minmax(0,1fr)}.step{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:14px}.step:first-child{border-top:0}.step .ico{grid-row:span 3;margin:0}}
a.trend{text-decoration:none;display:block}
.spark{margin-top:10px}.spark svg{width:100%;height:56px;display:block}
.spark-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
a.ext{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
a.ext:hover{background:var(--surface-2)}
a.fact-card{text-decoration:none;display:block;transition:transform .2s,box-shadow .2s}
a.fact-card:hover,a.trend:hover{transform:translateY(-2px)}
.mini{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2);cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--line-2)}
.ess{display:grid;gap:14px}
.ess-item{display:grid;grid-template-columns:200px minmax(0,1.2fr) minmax(0,1fr);gap:26px;align-items:center}
.ess-n .idx{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--muted)}
.ess-n .num{font-family:Fraunces,Georgia,serif;font-size:42px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:6px;color:var(--brand)}
.ess-item h3{font-size:18px}
.ess-item p{margin:8px 0 8px;color:var(--ink-2);font-size:14.5px}
.ess-item a.more{font-size:13px;font-weight:600;color:var(--brand);text-decoration:none}
@media (max-width:980px){.ess-item{grid-template-columns:minmax(0,1fr);gap:12px}}
.meter{height:8px;border-radius:4px;background:var(--surface-3);margin:10px 0 4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--eu);border-radius:4px}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.qopts{grid-template-columns:minmax(0,1fr)}}
.qopt{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 14px;text-align:left;cursor:pointer;font-size:14.5px}
.qopt:hover:not(:disabled){border-color:var(--ink)}
.qopt.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good);font-weight:650}
.qopt.ko{background:color-mix(in srgb,var(--crit) 15%,var(--surface));border-color:var(--crit)}
.qopt:disabled{cursor:default}
.brief p{font-size:16px;line-height:1.65;margin:8px 0 0;color:var(--ink);max-width:1000px}
.span3{grid-column:1/-1}
.score-row{display:flex;gap:12px;flex-wrap:wrap}
.score-it{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--c);min-width:180px}
.score-it b{font-size:30px;font-weight:760}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:120;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
@media print{.top,footer,.controls,.chips,.mini,.kmask,.hero .cta,svg.waves{display:none!important}body{background:#fff}.card,.kpi{box-shadow:none;break-inside:avoid}main{padding:0}}

.anim{display:flex;align-items:center;gap:14px;margin:0 0 12px;flex-wrap:wrap}
.anim-r{flex:1;min-width:160px}
.anim .yr{font-size:28px;font-weight:760;letter-spacing:-.02em;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
</style>

<script>'use strict';

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},kids=[]){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(v==null)continue;if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of [].concat(kids))if(c!=null)e.append(c);return e;}
function sv(tag,attrs={},kids=[]){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs)){if(v==null)continue;if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of [].concat(kids))if(c!=null)e.append(c);return e;}
const nf=(d=0)=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const F={n0:nf(0),n1:nf(1),n2:nf(2)};
function fmt(v,d=0){if(v==null||isNaN(v))return 'n.d.';return (d===0?F.n0:d===1?F.n1:F.n2).format(v);}
const euro=(v,d=0)=>v==null?'n.d.':fmt(v,d)+' €';
const pct=(v,d=1)=>v==null?'n.d.':fmt(v,d)+' %';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;for(const k of [1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(m<=k+1e-9)return k*p;return 10*p;}
function niceStep(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
function ticks(max,n=4){const s=niceStep(max/n);const t=[];for(let v=0;v<=max+1e-9;v+=s)t.push(+v.toFixed(6));return t;}
function hostW(h){const w=Math.round(h.getBoundingClientRect().width);return w>50?Math.max(300,w):640;}
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const D=window.D;
const ALL=[...D.EU,'UK'];
const NAME=c=>c==='EU'?'Moyenne UE 27':c==='EUR'?'Moyenne européenne':D.names[c]||c;
function flag(c,cls='flag'){const src=window.FLAGS[c==='EU'?'EU':c];return src?el('img',{src,alt:'',class:cls,loading:'lazy'}):el('span',{class:cls});}
const colorOf=c=>c==='UK'?'var(--uk)':c==='EU'?'var(--eu)':'var(--q5)';

/* ================= Indicateurs ================= */
const last=s=>s&&s.length?s[s.length-1]:null;
const valAt=(s,y)=>{if(!s)return null;const r=s.find(p=>p[0]===y);return r?r[1]:null;};
function E(k,c){const t=D.E[k];if(!t)return null;const v=t[c==='EU'?'EU':c];return v==null?null:v;}
function hicpChange(c,code='CP0441'){
  if(c==='UK'){return null;}
  const s=D.hicp[c]&&D.hicp[c][code];if(!s)return null;const a=valAt(s,2015),b=valAt(s,2025);if(a==null||b==null||a===0)return null;return (b/a-1)*100;}

/* ================= Courbes ================= */
function line(host,series,o={}){
  host.replaceChildren();host.classList.add('chart');
  const W=o.width||hostW(host),H=o.height||Math.round(clamp(W*0.5,240,340)),ml=o.ml||46,mr=o.mr||Math.min(170,Math.max(50,Math.max(...series.map(x=>x.name.length))*6.6+16)),mt=14,mb=28;
  const s=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':o.aria||'Graphique en courbes'});
  const all=series.flatMap(x=>x.data);if(!all.length){host.append(el('p',{class:'note',text:'Pas de données.'}));return;}
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  const xmin=o.xmin??Math.min(...xs),xmax=o.xmax??Math.max(...xs);
  let ymin=o.ymin??0;const ymax=o.ymax||niceMax(Math.max(...ys)*1.02);if(o.ymin==null&&Math.min(...ys)<0)ymin=-niceMax(-Math.min(...ys));
  const X=v=>ml+(v-xmin)/((xmax-xmin)||1)*(W-ml-mr),Y=v=>mt+(1-(v-ymin)/(ymax-ymin))*(H-mt-mb);
  const g=sv('g',{class:'axis'});const st=niceStep((ymax-ymin)/4);
  for(let v=Math.ceil(ymin/st)*st;v<=ymax+1e-9;v+=st){g.append(sv('line',{x1:ml,x2:W-mr,y1:Y(v),y2:Y(v),class:'gridl'}),sv('text',{x:ml-8,y:Y(v)+4,'text-anchor':'end',text:o.yfmt?o.yfmt(v):fmt(v)}));}
  const span=xmax-xmin;const xs2=[];const step=span>30?10:span>12?5:span>6?2:1;for(let v=Math.ceil(xmin/step)*step;v<=xmax;v+=step)xs2.push(v);
  for(const v of xs2)g.append(sv('text',{x:X(v),y:H-8,'text-anchor':'middle',text:o.xfmt?o.xfmt(v):String(v)}));
  s.append(g);
  if(o.band)for(const b of o.band){s.append(sv('rect',{x:ml,width:W-ml-mr,y:Y(Math.min(b.to,ymax)),height:Math.max(0,Y(b.from)-Y(Math.min(b.to,ymax))),fill:b.color,opacity:.12}));}
  if(o.hline)for(const h of o.hline){s.append(sv('line',{x1:ml,x2:W-mr,y1:Y(h.value),y2:Y(h.value),stroke:'var(--ink-2)','stroke-dasharray':'4 3','stroke-width':1}),sv('text',{x:ml+4,y:Y(h.value)-5,text:h.label,'font-size':11,fill:'var(--ink-2)'}));}
  const labels=[];
  for(const se of series){const d=se.data.filter(p=>p[1]!=null).sort((a,b)=>a[0]-b[0]);if(!d.length)continue;
    let path='';let prev=null;for(const p of d){path+=(prev!=null&&p[0]-prev>(o.gapYears||1.5)?'M':path?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1);prev=p[0];}
    s.append(sv('path',{d:path,fill:'none',stroke:se.color,'stroke-width':se.w||2,'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':se.dash||null}));
    const lp=d[d.length-1];s.append(sv('circle',{cx:X(lp[0]),cy:Y(lp[1]),r:3.5,fill:se.color,stroke:'var(--surface)','stroke-width':2}));
    labels.push({y:Y(lp[1]),x:X(lp[0]),t:se.name,c:se.color,v:lp[1]});}
  // étiquettes directes sans chevauchement
  labels.sort((a,b)=>a.y-b.y);for(let i=1;i<labels.length;i++)if(labels[i].y-labels[i-1].y<13)labels[i].y=labels[i-1].y+13;
  if(series.length<=8)for(const l of labels){s.append(sv('text',{x:W-mr+7,y:l.y+4,text:l.t,'font-size':11.5,'font-weight':600,fill:'var(--ink-2)'}));}
  const xh=sv('line',{class:'xh',y1:mt,y2:H-mb,visibility:'hidden'});s.append(xh);
  const dots=sv('g');s.append(dots);
  const ov=sv('rect',{x:ml,y:mt,width:W-ml-mr,height:H-mt-mb,fill:'transparent'});s.append(ov);
  const xsAll=[...new Set(all.map(p=>p[0]))].sort((a,b)=>a-b);
  function at(ev){const pt=s.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const lp=pt.matrixTransform(s.getScreenCTM().inverse());const xv=xmin+(lp.x-ml)/(W-ml-mr)*(xmax-xmin);let best=xsAll[0];for(const v of xsAll)if(Math.abs(v-xv)<Math.abs(best-xv))best=v;return best;}
  ov.addEventListener('pointermove',ev=>{const xv=at(ev);xh.setAttribute('x1',X(xv));xh.setAttribute('x2',X(xv));xh.setAttribute('visibility','visible');dots.replaceChildren();
    const rows=series.map(se=>({se,v:(se.data.find(p=>p[0]===xv)||[])[1]})).filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
    for(const r of rows)dots.append(sv('circle',{cx:X(xv),cy:Y(r.v),r:4,fill:r.se.color,stroke:'var(--surface)','stroke-width':2}));

  ov.addEventListener('pointerleave',()=>{xh.setAttribute('visibility','hidden');dots.replaceChildren();tipHide();});
  host.append(s);
}

/* ================= Nuage de points ================= */
function scatter(host,pts,o={}){
  host.replaceChildren();host.classList.add('chart');

  const g=sv('g',{class:'axis'});for(const t of ticks(ym,4))g.append(sv('line',{x1:ml,x2:W-mr,y1:Y(t),y2:Y(t),class:'gridl'}),sv('text',{x:ml-8,y:Y(t)+4,'text-anchor':'end',text:o.yfmt?o.yfmt(t):fmt(t)}));

  g.append(sv('text',{x:ml,y:mt-4,text:o.ylab||'','font-weight':600}));

    gg.append(sv('circle',{class:'bar',cx:X(p.x),cy:Y(p.y),r:p.id==='UK'||p.id==='EU'?7:5.5,fill:col,stroke:'var(--surface)','stroke-width':2,opacity:p.id==='UK'||p.id==='EU'?1:.85}));
    if(p.lab)gg.append(sv('text',{x:X(p.x)+8,y:Y(p.y)-7,text:p.id==='EU'?'UE':p.id,'font-size':10.5,'font-weight':p.id==='UK'||p.id==='EU'?700:500,fill:'var(--ink-2)'}));

/* ================= Échelle de couleurs ================= */
const Q=['--q1','--q2','--q3','--q4','--q5','--q6','--q7'];
function quantScale(values,n=6,bad){const v=values.filter(x=>x!=null).sort((a,b)=>a-b);const br=[];for(let i=1;i<n;i++)br.push(v[Math.floor(i*v.length/n)]);return {breaks:br,color:x=>{if(x==null)return 'var(--nodata)';let k=0;while(k<br.length&&x>=br[k])k++;return `var(${Q[k+ (n<7?1:0)]})`;}};}
function rampLegend(sc,key){const m=M[key];const box=el('div',{class:'ramp'});const sw=el('div',{class:'sw'});const n=sc.breaks.length+1;for(let k=0;k<n;k++)sw.append(el('i',{style:`background:var(${Q[k+(n<7?1:0)]})`}));const lo=fv(key,sc.breaks[0]),hi=fv(key,sc.breaks[sc.breaks.length-1]);box.append(el('span',{text:'< '+lo}),sw,el('span',{text:'≥ '+hi}),el('span',{class:'pill',html:'<i class="dot" style="background:repeating-linear-gradient(45deg,var(--nodata) 0 3px,var(--muted) 3px 4.5px);box-shadow:0 0 0 1px var(--line-2)"></i> non disponible'}));return box;}

function choropleth(host,key,o={}){
  host.replaceChildren();host.classList.add('mapbox');

  s.append(sv('defs',{},[sv('pattern',{id:'ndh',width:7,height:7,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},[sv('rect',{width:7,height:7,fill:'var(--nodata)'}),sv('line',{x1:0,y1:0,x2:0,y2:7,stroke:'var(--muted)','stroke-width':1.6,opacity:.55})])]));
  for(const d of G.ctx)s.append(sv('path',{class:'x',d}));

    const p=sv('path',{class:'c','data-c':c,d,fill:v==null?'url(#ndh)':sc.color(v)});
    bindTip(p,t=>{t.append(tipTitle(NAME(c)+(UKN.includes(id)?' · '+({ENG:'Angleterre',SCT:'Écosse',WLS:'Pays de Galles',NIR:'Irlande du Nord'})[id]:''),c));t.append(tipRow(fvu(key,v),o.year?String(o.year):'',null));const rk=o.get?null:rankOf(key,c);if(rk)t.append(el('div',{class:'note',text:`Rang ${rk.r} sur ${rk.n} (du plus élevé au plus bas)`}));const eu=get('EU');if(eu!=null&&v!=null&&c!=='EU'){const dd=(v/eu-1)*100;t.append(el('div',{class:'note',text:(dd>=0?'+':'')+fmt(dd,0)+' % par rapport à la moyenne UE'}));}{const n=note(key,c);if(n)t.append(el('div',{class:'note',text:'* '+n,style:'margin-top:4px'}));}t.append(el('div',{class:'note',text:'Cliquer pour la fiche pays',style:'margin-top:4px;font-style:italic'}));});

  for(const c of ['MT','LU','CY']){const ct=G.cent[c];if(!ct)continue;const v=get(c);const g=sv('g',{style:'cursor:pointer'});g.append(sv('circle',{cx:ct[0],cy:ct[1],r:9,fill:sc.color(v),stroke:'var(--ink-2)','stroke-width':1.2}));g.append(sv('text',{x:ct[0]+13,y:ct[1]+4,text:c,'font-size':11,'font-weight':700,fill:'var(--ink-2)'}));bindTip(g,t=>{t.append(tipTitle(NAME(c),c));t.append(tipRow(fvu(key,v),'',null));});g.addEventListener('click',()=>go('pays/'+c));s.append(g);}
  if(o.labels!==false){for(const c of codes){const id=c==='UK'?'ENG':c;const ct=G.cent[id];if(!ct||['MT','LU','CY','BE','SI','EE','LV','LT','NL','DK','SK','HR','AT','CZ','HU'].includes(c))continue;const v=get(c);if(v==null)continue;const t=sv('text',{x:ct[0]+(c==='UK'?10:0),y:ct[1]+(c==='UK'?18:4),'text-anchor':'middle',text:fv(key,v),'font-size':12,'font-weight':700,fill:'var(--ink)',stroke:'var(--surface)','stroke-width':3,'paint-order':'stroke','pointer-events':'none'});s.append(t);}}

/* ================= Tableaux triables ================= */
function table(host,cols,rows,o={}){
  host.replaceChildren();const wrap=el('div',{class:'tbl-wrap'});const t=el('table',{class:'t',style:o.minW?'min-width:'+o.minW+'px':null});
  let sortK=o.sort||1,dir=-1;
  const thead=el('thead');const tr=el('tr');cols.forEach((c,i)=>{const th=el('th',{text:c.label+(c.unit?' ('+c.unit+')':''),title:'Trier'});th.addEventListener('click',()=>{if(sortK===i)dir=-dir;else{sortK=i;dir=i===0?1:-1;}draw();});tr.append(th);});thead.append(tr);t.append(thead);
  const tb=el('tbody');t.append(tb);
  const maxes=cols.map(c=>Math.max(...rows.map(r=>typeof c.get(r)==='number'?c.get(r):0)));
  function draw(){tb.replaceChildren();const rs=[...rows].sort((a,b)=>{const x=cols[sortK].get(a),y=cols[sortK].get(b);if(x==null)return 1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y,'fr'):x-y)*dir;});
    for(const r of rs){const row=el('tr',{class:r.id==='UK'?'uk':r.id==='EU'?'eu':''});cols.forEach((c,i)=>{const v=c.get(r);const td=el('td');if(i===0){td.append(flag(r.id));td.append(document.createTextNode(' '+NAME(r.id)));if(D.names[r.id]&&r.id!=='EU'){td.style.cursor='pointer';td.addEventListener('click',()=>go('pays/'+r.id));}}else{td.textContent=c.fmt?c.fmt(v):fmt(v);if(o.bars&&typeof v==='number'&&maxes[i]>0)td.append(el('i',{class:'cellbar',style:`width:${Math.round(v/maxes[i]*46)}px`}));}row.append(td);});tb.append(row);}}
  draw();wrap.append(t);host.append(wrap);
}
function csvDownload(name,cols,rows){const esc=v=>{v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};const lines=[cols.map(c=>esc(c.label+(c.unit?' ('+c.unit+')':''))).join(';')];for(const r of rows)lines.push(cols.map((c,i)=>{const v=c.get(r);return esc(i===0?NAME(r.id):v==null?'':typeof v==='number'?String(Math.round(v*100)/100).replace('.',','):v);}).join(';'));const b=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=el('a',{href:URL.createObjectURL(b),download:name});document.body.append(a);a.click();a.remove();}

function csvBtn(name,rows,head){const b=el('button',{class:'mini',title:'Télécharger les données (CSV)','aria-label':'Télécharger les données'},[]);b.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>CSV';b.onclick=()=>{const L=[head.join(';')].concat(rows.map(r=>r.map(v=>v==null?'':typeof v==='number'?String(Math.round(v*100)/100).replace('.',','):'"'+String(v).replace(/"/g,'""')+'"').join(';')));const bl=new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'});const a=el('a',{href:URL.createObjectURL(bl),download:'hydria-'+name+'.csv'});document.body.append(a);a.click();a.remove();};return b;}

  const box=el('div',{class:'grid',style:'gap:14px;max-width:820px'});w.append(box);
  let score=0,done=0;const res=el('div',{class:'card fade',style:'max-width:820px;margin-top:16px;display:none'});
  QUIZ.forEach(([q,opts,ok,exp],i)=>{const c=el('section',{class:'card fade quiz'});c.append(el('div',{class:'eyebrow',text:'Question '+(i+1)+' sur '+QUIZ.length}),el('h3',{text:q,style:'margin:6px 0 12px'}));const o=el('div',{class:'qopts'});const ex=el('p',{class:'note',style:'margin:10px 0 0;display:none',text:exp});
    opts.forEach((t,j)=>{const b=el('button',{class:'qopt',text:t});b.onclick=()=>{if(c.dataset.done)return;c.dataset.done=1;done++;if(j===ok)score++;$$('.qopt',o).forEach((x,m)=>{x.disabled=true;if(m===ok)x.classList.add('ok');else if(m===j)x.classList.add('ko');});ex.style.display='block';if(done===QUIZ.length){res.style.display='block';res.replaceChildren(el('div',{class:'big',text:score+'/'+QUIZ.length}),el('p',{text:score>=9?'Expert de l’eau : chapeau.':score>=6?'Belle connaissance du sujet.':'L’application regorge de réponses : bonne exploration !',style:'margin:8px 0 12px;color:var(--ink-2)'}),el('button',{class:'btn',text:'Recommencer',onclick:()=>render()}));res.scrollIntoView({behavior:'smooth',block:'center'});}};o.append(b);});
    c.append(o,ex);box.append(c);});
  w.append(res);
};

const PREP={BE:'en Belgique',BG:'en Bulgarie',CZ:'en Tchéquie',DK:'au Danemark',DE:'en Allemagne',EE:'en Estonie',IE:'en Irlande',EL:'en Grèce',ES:'en Espagne',FR:'en France',HR:'en Croatie',IT:'en Italie',CY:'à Chypre',LV:'en Lettonie',LT:'en Lituanie',LU:'au Luxembourg',HU:'en Hongrie',MT:'à Malte',NL:'aux Pays-Bas',AT:'en Autriche',PL:'en Pologne',PT:'au Portugal',RO:'en Roumanie',SI:'en Slovénie',SK:'en Slovaquie',FI:'en Finlande',SE:'en Suède',UK:'au Royaume-Uni'};
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
function cmpEU(v,eu){const d=(v/eu-1)*100;if(Math.abs(d)<3)return 'au niveau de la moyenne européenne';return fmt(Math.abs(d),0)+' % '+(d>0?'de plus':'de moins')+' que la moyenne européenne';}
function brief(c){const P=PREP[c],out=[];const g=k=>M[k].get(c),rk=k=>rankOf(k,c);
  const l=g('lpd');if(l!=null)out.push(`${cap1(P)}, un habitant utilise ${fmt(l,0)} litres d’eau du robinet par jour, ${cmpEU(l,127.2)}.`);
  else if(c==='IT')out.push('En Italie, 214 litres d’eau potable sont distribués par habitant et par jour, tous usages autorisés confondus (ISTAT, 2022), et 28,8 % des familles ne boivent pas l’eau du robinet.');
  const t=g('tariff');if(t!=null&&t>0){const r=rk('tariff');out.push(`Le mètre cube, eau et assainissement compris, y coûte ${fmt(t,2)} € (${r.r}e prix le plus élevé sur ${r.n})${note('tariff',c)?' ['+note('tariff',c).replace(/\.$/,'').toLowerCase()+']':''}.`);}
  else if(c==='IE')out.push('Les ménages n’y paient pas l’eau : le service est financé par l’impôt.');
  else if(t==null)out.push('Aucun prix moyen national n’y est publié.');
  const b=g('bill'),bi=g('billinc');if(b&&bi)out.push(`Un ménage y consacre en moyenne ${fmt(b,0)} € par an, soit ${fmt(bi,2)} % de son revenu.`);
  const rl=g('realloss');if(rl!=null)out.push(`Les fuites emportent ${fmt(rl,1)} % de l’eau produite${rl>30?', l’un des niveaux les plus élevés d’Europe':rl<10?', l’un des réseaux les plus étanches d’Europe':''}.`);
  const w=g('wei');if(w!=null)out.push(`Son indice de stress hydrique atteint ${fmt(w,1)} % en 2023${w>=40?' : un stress sévère':w>=20?' : une situation de stress':w>=10?', une tension modérée':', sans stress global en moyenne annuelle'}.`);
  const te=g('tertiary');if(te!=null)out.push(`${fmt(te,0)} % des eaux usées y sont traitées jusqu’au niveau tertiaire.`);
  const ba=g('bath');if(ba!=null)out.push(`${fmt(ba,1)} % de ses sites de baignade sont d’excellente qualité${c==='UK'?' (Angleterre)':''}.`);
  return out.join(' ').replace(/ (€|%)/g,'\u00a0$1');}
</script>
<script>
(function(){
  document.body.append(TIP);
  const tabs=document.getElementById('tabs');
  for(const[r,l]of ROUTES){tabs.append(el('a',{href:'#/'+r,'data-r':r,text:l}));}
  // thème
  const segs=$$('.seg[aria-label="Thème"] button');
  function setT(t){try{localStorage.setItem('hydria-theme',t);}catch(e){}if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);segs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));}
  let cur='auto';try{cur=localStorage.getItem('hydria-theme')||'auto';}catch(e){}segs.forEach(b=>{b.setAttribute('aria-pressed',b.dataset.t===cur);b.onclick=()=>setT(b.dataset.t);});
  // recherche
  const mask=$('#kmask'),kin=$('#kin'),kres=$('#kres');
  const items=[...ROUTES.map(([r,l])=>({t:l,h:'#/'+r,k:'page',s:'Page'})),...ALL.map(c=>({t:NAME(c),h:'#/pays/'+c,k:c,s:'Fiche pays',f:c,x:(D.cap[c]||'')+' '+c})),...MKEYS.map(k=>({t:M[k].label,h:'#/classements/'+k,k,s:'Classement',x:M[k].short+' '+M[k].unit}))];
  let sel=0,list=[];
  function open(){mask.classList.add('on');kin.value='';find();setTimeout(()=>kin.focus(),10);}
  function close(){mask.classList.remove('on');}
  function find(){const q=deacc(kin.value.trim());const ws=q.split(/\s+/).filter(Boolean);list=items.filter(it=>{const h=deacc(it.t+' '+(it.x||'')+' '+it.s);return ws.every(w=>h.includes(w));}).slice(0,12);sel=0;draw();}
  function draw(){kres.replaceChildren();if(!list.length){kres.append(el('div',{class:'note',text:'Aucun résultat.',style:'padding:14px'}));return;}list.forEach((it,i)=>{const a=el('a',{href:it.h,class:i===sel?'on':''});if(it.f)a.append(flag(it.f));a.append(el('span',{text:it.t}),el('small',{text:it.s}));a.onclick=()=>close();kres.append(a);});}
  kin.addEventListener('input',find);
  kin.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(list.length-1,sel+1);draw();e.preventDefault();}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault();}else if(e.key==='Enter'&&list[sel]){location.hash=list[sel].h;close();}else if(e.key==='Escape')close();});
  mask.addEventListener('click',e=>{if(e.target===mask)close();});
  $('#openK').onclick=open;
  document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if((e.key==='/'&&tag!=='input'&&tag!=='textarea'&&tag!=='select')||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();open();}else if(e.key==='Escape')close();});
  const toast=el('div',{class:'toast',role:'status'});document.body.append(toast);
  $('#share').onclick=async()=>{const u=location.href;try{if(navigator.share){await navigator.share({title:document.title,url:u});return;}}catch(e){return;}try{await navigator.clipboard.writeText(u);toast.textContent='Lien copié : vous pouvez le coller où vous voulez.';}catch(e){toast.textContent=u;}toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2600);};
  window.addEventListener('hashchange',render);
  render();
})();
</script>
